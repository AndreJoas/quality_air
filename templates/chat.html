<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Chat Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            padding: 2rem;
        }
        
        #chat-box div.user-msg {
            font-weight: bold;
        }
        
        #chat-box div.bot-msg {
            color: #0d6efd;
            white-space: pre-wrap;
            /* para manter quebras de linha */
        }
    </style>
</head>

<body>
    <h2>Chat Inteligente sobre Qualidade do Ar 🌎</h2>

    <div id="chat-box" class="border rounded p-3 mb-3" style="height:60vh; overflow-y:auto;"></div>

    <form id="chat-form" class="d-flex">
        <input id="question" class="form-control me-2" placeholder="Digite sua pergunta…" required autocomplete="off" />
        <button class="btn btn-success">Enviar</button>
    </form>

    <script>
        const box = document.getElementById("chat-box");
        const form = document.getElementById("chat-form");
        const inp = document.getElementById("question");

        const addMsg = (txt, cls = "") => {
            const div = document.createElement("div");
            div.className = cls;
            if (cls.includes("bot-msg")) {
                div.innerHTML = txt; // aqui aceita HTML para bot
            } else {
                div.textContent = txt; // para usuário texto puro
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        };

        form.addEventListener("submit", async e => {
            e.preventDefault();
            const q = inp.value.trim();
            if (!q) return;

            addMsg("👤 " + q, "user-msg");
            inp.value = "";
            addMsg("🤖 pensando…", "bot-msg loading");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: q
                    })
                });

                const data = await response.json();
                console.log("Resposta do backend:", data);

                const botResponse = data.answer || data.error || "Erro desconhecido.";

                // Remove a mensagem "pensando…"
                const loadingDiv = box.querySelector(".loading");
                if (loadingDiv) loadingDiv.remove();

                addMsg("🤖 " + botResponse, "bot-msg");
            } catch (error) {
                const loadingDiv = box.querySelector(".loading");
                if (loadingDiv) loadingDiv.remove();
                addMsg("🤖 Erro ao conectar com o servidor.", "bot-msg");
            }
        });
    </script>
</body>

</html>
